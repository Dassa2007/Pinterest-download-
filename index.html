<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DG DOWNLOADER - Pinterest Video Downloader</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
    <style>
        /* ── Reset & Base ── */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;
            background: #0d0d0d;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(ellipse at 20% 50%, #1a0a1e 0%, #0d0d0d 70%);
        }

        /* ── Main Container ── */
        .container {
            width: 100%;
            max-width: 820px;
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 40px;
            padding: 40px 36px 48px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.3s ease;
        }

        /* ── Header ── */
        .header {
            text-align: center;
            margin-bottom: 34px;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, #e60023, #c0001a);
            padding: 10px 28px 10px 22px;
            border-radius: 60px;
            box-shadow: 0 8px 30px rgba(230, 0, 35, 0.30);
            margin-bottom: 14px;
        }

        .logo i {
            font-size: 28px;
            color: #fff;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.3));
        }

        .logo h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .logo h1 span {
            font-weight: 300;
            opacity: 0.8;
        }

        .subhead {
            color: rgba(255, 255, 255, 0.55);
            font-size: 15px;
            font-weight: 400;
            letter-spacing: 0.3px;
            margin-top: 4px;
        }

        .subhead i {
            margin: 0 6px;
            color: #e60023;
        }

        /* ── Input Section ── */
        .input-section {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 28px;
            padding: 6px 6px 6px 22px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: border-color 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .input-section:focus-within {
            border-color: rgba(230, 0, 35, 0.5);
            box-shadow: 0 4px 30px rgba(230, 0, 35, 0.12), inset 0 0 0 1px rgba(230, 0, 35, 0.1);
        }

        .input-section i {
            color: rgba(255, 255, 255, 0.25);
            font-size: 18px;
        }

        .input-section input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 16px;
            font-weight: 400;
            padding: 16px 0;
            font-family: "Inter", sans-serif;
            letter-spacing: 0.2px;
        }

        .input-section input::placeholder {
            color: rgba(255, 255, 255, 0.25);
            font-weight: 300;
        }

        .input-section .btn-download {
            background: linear-gradient(135deg, #e60023, #b8001a);
            border: none;
            border-radius: 60px;
            padding: 14px 30px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            font-family: "Inter", sans-serif;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
            box-shadow: 0 6px 20px rgba(230, 0, 35, 0.30);
        }

        .input-section .btn-download i {
            color: #fff;
            font-size: 16px;
        }

        .input-section .btn-download:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(230, 0, 35, 0.45);
        }

        .input-section .btn-download:active {
            transform: scale(0.97);
        }

        .input-section .btn-download:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ── Loader ── */
        .loader-wrapper {
            display: none;
            justify-content: center;
            align-items: center;
            padding: 40px 0 20px;
        }

        .loader-wrapper.active {
            display: flex;
        }

        .loader {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.06);
            border-top-color: #e60023;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ── Result / Video Card ── */
        .result-area {
            margin-top: 28px;
            display: none;
            animation: fadeUp 0.5s ease;
        }

        .result-area.active {
            display: block;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .video-card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 28px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.5);
        }

        .video-wrapper {
            position: relative;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 240px;
        }

        .video-wrapper video {
            width: 100%;
            max-height: 520px;
            display: block;
            background: #0a0a0a;
            border-radius: 0;
            object-fit: cover;
        }

        .video-wrapper .play-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 30px;
            pointer-events: none;
            border: 2px solid rgba(255, 255, 255, 0.15);
            transition: opacity 0.3s;
        }

        .video-wrapper .play-overlay.hidden {
            opacity: 0;
        }

        .video-info {
            padding: 22px 28px 28px;
        }

        .video-info .title-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            flex-wrap: wrap;
        }

        .video-info .title-row h3 {
            color: #fff;
            font-size: 18px;
            font-weight: 500;
            line-height: 1.4;
            word-break: break-word;
            max-width: 70%;
        }

        .video-info .title-row h3 i {
            color: #e60023;
            margin-right: 8px;
        }

        .video-info .meta {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin: 14px 0 18px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
        }

        .video-info .meta span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .video-info .meta span i {
            color: rgba(255, 255, 255, 0.2);
            font-size: 14px;
        }

        .download-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 6px;
        }

        .download-actions .btn-dl {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 26px;
            border-radius: 60px;
            font-size: 14px;
            font-weight: 600;
            font-family: "Inter", sans-serif;
            border: none;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .download-actions .btn-dl i {
            font-size: 16px;
        }

        .download-actions .btn-dl.primary {
            background: linear-gradient(135deg, #e60023, #b8001a);
            border: none;
            box-shadow: 0 6px 24px rgba(230, 0, 35, 0.30);
            color: #fff;
        }

        .download-actions .btn-dl.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 34px rgba(230, 0, 35, 0.45);
        }

        .download-actions .btn-dl.secondary:hover {
            background: rgba(255, 255, 255, 0.14);
            transform: translateY(-2px);
        }

        .download-actions .btn-dl:active {
            transform: scale(0.96);
        }

        /* ── Error Message ── */
        .error-msg {
            margin-top: 20px;
            padding: 18px 24px;
            background: rgba(230, 0, 35, 0.10);
            border-radius: 20px;
            border: 1px solid rgba(230, 0, 35, 0.15);
            color: #ff6b7a;
            font-size: 14px;
            display: none;
            align-items: center;
            gap: 12px;
        }

        .error-msg.active {
            display: flex;
        }

        .error-msg i {
            font-size: 20px;
        }

        /* ── Empty State (no result) ── */
        .empty-state {
            margin-top: 24px;
            text-align: center;
            padding: 28px 10px 12px;
            color: rgba(255, 255, 255, 0.15);
        }

        .empty-state i {
            font-size: 44px;
            margin-bottom: 10px;
            display: block;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 14px;
            font-weight: 300;
        }

        /* ── Footer ── */
        .footer {
            text-align: center;
            margin-top: 32px;
            color: rgba(255, 255, 255, 0.12);
            font-size: 12px;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .footer a {
            color: rgba(255, 255, 255, 0.2);
            text-decoration: none;
            transition: color 0.3s;
        }

        .footer a:hover {
            color: rgba(255, 255, 255, 0.4);
        }

        /* ── Responsive ── */
        @media (max-width: 640px) {
            .container {
                padding: 24px 18px 32px;
                border-radius: 28px;
            }

            .logo {
                padding: 8px 18px 8px 14px;
            }

            .logo h1 {
                font-size: 17px;
            }

            .logo i {
                font-size: 22px;
            }

            .input-section {
                flex-wrap: wrap;
                padding: 6px 6px 6px 16px;
                border-radius: 20px;
                background: rgba(255, 255, 255, 0.03);
            }

            .input-section input {
                font-size: 14px;
                padding: 14px 0;
                width: 100%;
            }

            .input-section .btn-download {
                width: 100%;
                justify-content: center;
                padding: 14px;
                font-size: 14px;
                border-radius: 40px;
            }

            .input-section i.fa-link {
                display: none;
            }

            .video-info {
                padding: 18px 16px 22px;
            }

            .video-info .title-row h3 {
                max-width: 100%;
                font-size: 16px;
            }

            .download-actions .btn-dl {
                flex: 1;
                justify-content: center;
                padding: 12px 18px;
                font-size: 13px;
            }

            .video-info .meta {
                font-size: 12px;
                gap: 12px;
            }

            .subhead {
                font-size: 13px;
            }

            .video-wrapper video {
                max-height: 360px;
            }
        }

        @media (max-width: 420px) {
            .container {
                padding: 16px 12px 24px;
                border-radius: 20px;
            }

            .logo h1 {
                font-size: 15px;
            }

            .input-section .btn-download {
                font-size: 13px;
                padding: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ─── HEADER ─── -->
        <header class="header">
            <div class="logo">
                <i class="fab fa-pinterest"></i>
                <h1>DG <span>DOWNLOADER</span></h1>
            </div>
            <p class="subhead">
                <i class="fas fa-download"></i>
                Paste any Pinterest video URL &amp; download in HD
                <i class="fas fa-download"></i>
            </p>
        </header>

        <!-- ─── INPUT ─── -->
        <div class="input-section">
            <i class="fas fa-link"></i>
            <input
            type="url"
            id="pinterestUrl"
            placeholder="Paste Pinterest video URL here…"
            autofocus
            />
            <button class="btn-download" id="fetchBtn">
                <i class="fas fa-arrow-right"></i> Get Video
            </button>
        </div>

        <!-- ─── LOADER ─── -->
        <div class="loader-wrapper" id="loaderWrapper">
            <div class="loader"></div>
        </div>

        <!-- ─── ERROR ─── -->
        <div class="error-msg" id="errorMsg">
            <i class="fas fa-circle-exclamation"></i>
            <span id="errorText">Something went wrong. Please check the URL and try again.</span>
        </div>

        <!-- ─── RESULT ─── -->
        <div class="result-area" id="resultArea">
            <div class="video-card" id="videoCard">
                <!-- video wrapper -->
                <div class="video-wrapper" id="videoWrapper">
                    <video id="videoPlayer" controls controlslist="nodownload" playsinline>
                        Your browser does not support the video tag.
                    </video>
                    <div class="play-overlay" id="playOverlay">
                        <i class="fas fa-play"></i>
                    </div>
                </div>
                <!-- info -->
                <div class="video-info">
                    <div class="title-row">
                        <h3 id="videoTitle"><i class="fab fa-pinterest"></i> Video</h3>
                    </div>
                    <div class="meta" id="videoMeta">
                        <span><i class="fas fa-clock"></i> <span id="videoDuration">—</span></span>
                        <span><i class="fas fa-expand"></i> <span id="videoResolution">HD</span></span>
                    </div>
                    <div class="download-actions">
                        <a href="#" class="btn-dl primary" id="downloadBtn" download>
                            <i class="fas fa-download"></i> Download Video
                        </a>
                        <button class="btn-dl secondary" id="copyLinkBtn">
                            <i class="fas fa-copy"></i> Copy Link
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ─── EMPTY STATE (subtle) ─── -->
        <div class="empty-state" id="emptyState">
            <i class="fab fa-pinterest"></i>
            <p>Paste a Pinterest video URL above</p>
        </div>

        <!-- ─── FOOTER ─── -->
        <div class="footer">
            DG DOWNLOADER &bull; built with <i class="fas fa-heart" style="color:rgba(230,0,35,0.3);"></i>
        </div>

    </div>

    <!-- ──────────────────────────────────────────────── -->
    <!-- ─── JAVASCRIPT ─── -->
    <script>
        (function() {
            'use strict';

            // ── DOM refs ──
            const urlInput = document.getElementById('pinterestUrl');
            const fetchBtn = document.getElementById('fetchBtn');
            const loaderWrapper = document.getElementById('loaderWrapper');
            const errorMsg = document.getElementById('errorMsg');
            const errorText = document.getElementById('errorText');
            const resultArea = document.getElementById('resultArea');
            const videoPlayer = document.getElementById('videoPlayer');
            const playOverlay = document.getElementById('playOverlay');
            const videoTitle = document.getElementById('videoTitle');
            const videoDuration = document.getElementById('videoDuration');
            const videoResolution = document.getElementById('videoResolution');
            const downloadBtn = document.getElementById('downloadBtn');
            const copyLinkBtn = document.getElementById('copyLinkBtn');
            const emptyState = document.getElementById('emptyState');

            // ── API config ──
            const API_KEY = 'zanta_JatdaWBTIbi4uSdilQ1q6gE3';
            const BASE_URL = 'https://api.zanta-mini.store/api/pinterest';

            // ── State ──
            let currentVideoUrl = '';
            let currentVideoData = null;

            // ── Helpers ──
            function showLoader(show) {
                loaderWrapper.classList.toggle('active', show);
            }

            function showError(message) {
                errorText.textContent = message || 'Something went wrong. Please try again.';
                errorMsg.classList.add('active');
            }

            function hideError() {
                errorMsg.classList.remove('active');
            }

            function showResult(show) {
                resultArea.classList.toggle('active', show);
                emptyState.style.display = show ? 'none' : 'block';
            }

            function formatDuration(seconds) {
                if (!seconds || isNaN(seconds)) return '—';
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                return `${m}:${s.toString().padStart(2, '0')}`;
            }

            // ── Core fetch ──
            async function fetchPinterestVideo(url) {
                if (!url || url.trim() === '') {
                    showError('Please enter a Pinterest video URL.');
                    return;
                }

                // clean URL
                let cleanUrl = url.trim();
                // if no protocol, add https
                if (!/^https?:\/\//i.test(cleanUrl)) {
                    cleanUrl = 'https://' + cleanUrl;
                }

                // validate Pinterest URL
                if (!cleanUrl.includes('pinterest') && !cleanUrl.includes('pin.it')) {
                    showError('Please enter a valid Pinterest video URL.');
                    return;
                }

                hideError();
                showLoader(true);
                showResult(false);
                fetchBtn.disabled = true;
                fetchBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading…';

                try {
                    const encodedUrl = encodeURIComponent(cleanUrl);
                    const apiUrl = `${BASE_URL}?apiKey=${API_KEY}&url=${encodedUrl}`;

                    const response = await fetch(apiUrl, {
                        method: 'GET',
                        headers: {
                            'Accept': 'application/json',
                        },
                    });

                    if (!response.ok) {
                        let errMsg = `Server responded with ${response.status}`;
                        try {
                            const errJson = await response.json();
                            if (errJson.message) errMsg = errJson.message;
                        } catch (_) { /* ignore */ }
                        throw new Error(errMsg);
                    }

                    const data = await response.json();
                    console.log('API Response:', data);

                    // ── Parse response ──
                    // Expected structure: { success, data: { title, video_url, duration?, resolution?, thumbnail? } }
                    if (!data.success) {
                        throw new Error(data.message || 'Failed to fetch video.');
                    }

                    const videoData = data.data || data;
                    // Try different possible fields
                    const videoUrl = videoData.video_url || videoData.videoUrl || videoData.download_url || videoData.url;
                    const title = videoData.title || videoData.caption || 'Pinterest Video';
                    const duration = videoData.duration || videoData.duration_sec || null;
                    const resolution = videoData.resolution || videoData.quality || 'HD';

                    if (!videoUrl) {
                        throw new Error('No video URL found in the response.');
                    }

                    // store
                    currentVideoUrl = videoUrl;
                    currentVideoData = { videoUrl, title, duration, resolution };

                    // ── Populate UI ──
                    videoTitle.innerHTML = `<i class="fab fa-pinterest"></i> ${title}`;
                    videoDuration.textContent = formatDuration(duration);
                    videoResolution.textContent = resolution || 'HD';

                    // set video source
                    videoPlayer.src = videoUrl;
                    videoPlayer.load();

                    // show result
                    showResult(true);
                    hideError();

                    // update download button
                    downloadBtn.href = videoUrl;
                    downloadBtn.setAttribute('download', `${title.replace(/[^a-zA-Z0-9 ]/g, '').trim() || 'pinterest'}.mp4`);

                    // auto-play hint: show overlay until user plays
                    playOverlay.classList.remove('hidden');

                    // handle play to hide overlay
                    videoPlayer.onplay = function() {
                        playOverlay.classList.add('hidden');
                    };
                    videoPlayer.onpause = function() {
                        // show overlay only if not ended
                        if (!videoPlayer.ended) {
                            playOverlay.classList.remove('hidden');
                        }
                    };
                    videoPlayer.onended = function() {
                        playOverlay.classList.remove('hidden');
                    };

                } catch (err) {
                    console.error('Fetch error:', err);
                    showError(err.message || 'Failed to fetch video. Please check the URL and try again.');
                    showResult(false);
                } finally {
                    showLoader(false);
                    fetchBtn.disabled = false;
                    fetchBtn.innerHTML = '<i class="fas fa-arrow-right"></i> Get Video';
                }
            }

            // ── Copy link ──
            function copyVideoLink() {
                if (!currentVideoUrl) {
                    showError('No video loaded to copy.');
                    return;
                }
                navigator.clipboard.writeText(currentVideoUrl)
                    .then(() => {
                        const original = copyLinkBtn.innerHTML;
                        copyLinkBtn.innerHTML = '<i class="fas fa-check"></i> Copied!';
                        setTimeout(() => {
                            copyLinkBtn.innerHTML = original;
                        }, 2000);
                    })
                    .catch(() => {
                        // fallback
                        const textarea = document.createElement('textarea');
                        textarea.value = currentVideoUrl;
                        document.body.appendChild(textarea);
                        textarea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textarea);
                        const original = copyLinkBtn.innerHTML;
                        copyLinkBtn.innerHTML = '<i class="fas fa-check"></i> Copied!';
                        setTimeout(() => {
                            copyLinkBtn.innerHTML = original;
                        }, 2000);
                    });
            }

            // ── Event listeners ──
            fetchBtn.addEventListener('click', function(e) {
                e.preventDefault();
                fetchPinterestVideo(urlInput.value);
            });

            // Enter key on input
            urlInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    fetchBtn.click();
                }
            });

            copyLinkBtn.addEventListener('click', copyVideoLink);

            // ── Auto-focus ──
            urlInput.focus();

            // ── Paste detection: if user pastes a URL, auto-trigger? (optional) ──
            // We'll keep it manual to be safe.

            // ── On load, if URL has a query param ?url=... ──
            (function handleQueryParam() {
                const params = new URLSearchParams(window.location.search);
                const urlParam = params.get('url');
                if (urlParam) {
                    urlInput.value = urlParam;
                    fetchBtn.click();
                }
            })();

        })();
    </script>

</body>
</html>
