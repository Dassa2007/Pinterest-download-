<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pinterest Downloader — DG</title>

    <!-- Font Awesome 6 (free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />

    <style>
        /* ---------- RESET ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #08080e;
            background-image:
                radial-gradient(ellipse at 20% 30%, rgba(255, 70, 120, 0.10) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(0, 180, 255, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(255, 200, 50, 0.04) 0%, transparent 70%);
            padding: 20px;
        }

        /* ---------- MAIN CARD (glass) ---------- */
        .container {
            max-width: 760px;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 44px;
            padding: 40px 40px 32px;
            box-shadow:
                0 40px 100px rgba(0, 0, 0, 0.7),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        /* glowing orbs */
        .container::before {
            content: '';
            position: absolute;
            top: -30%;
            right: -20%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 70, 120, 0.18) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: floatOrb 14s ease-in-out infinite alternate;
        }

        .container::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -15%;
            width: 260px;
            height: 260px;
            background: radial-gradient(circle, rgba(0, 180, 255, 0.12) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: floatOrb 16s ease-in-out infinite alternate-reverse;
        }

        @keyframes floatOrb {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(30px, -20px) scale(1.3);
            }
        }

        .container>* {
            position: relative;
            z-index: 1;
        }

        /* ---------- TOP BAR: Tip + Pinterest Logo ---------- */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
        }

        .brand-icon {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .brand-icon i {
            font-size: 1.6rem;
            color: #e60023;
            /* Pinterest red */
            filter: drop-shadow(0 0 12px rgba(230, 0, 35, 0.3));
        }

        .brand-icon span {
            color: rgba(255, 255, 255, 0.3);
            font-weight: 300;
            margin-left: 4px;
        }

        .tip-btn {
            background: rgba(255, 215, 0, 0.12);
            border: 1px solid rgba(255, 215, 0, 0.15);
            color: #fbbf24;
            padding: 8px 20px;
            border-radius: 60px;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: background 0.25s ease, transform 0.2s ease;
            text-decoration: none;
            font-family: 'Inter', sans-serif;
            backdrop-filter: blur(4px);
        }

        .tip-btn:hover {
            background: rgba(255, 215, 0, 0.20);
            transform: scale(1.03);
        }

        .tip-btn i {
            font-size: 0.9rem;
        }

        /* ---------- HEADER ---------- */
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #f9e8ff 0%, #ffa8c5 40%, #ff7b9c 70%, #f9416b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: inline-block;
            text-shadow: 0 0 60px rgba(255, 70, 120, 0.2);
        }

        .logo h1 i {
            -webkit-text-fill-color: initial;
            color: #e60023;
            font-size: 2rem;
            margin-right: 8px;
            filter: drop-shadow(0 0 16px rgba(230, 0, 35, 0.2));
        }

        .logo p {
            color: rgba(255, 255, 255, 0.45);
            font-size: 0.95rem;
            margin-top: 10px;
            font-weight: 400;
            letter-spacing: 0.4px;
        }

        .logo p i {
            color: #e60023;
            margin-right: 6px;
        }

        /* ---------- INPUT GROUP ---------- */
        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 60px;
            padding: 5px 5px 5px 24px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .input-group:focus-within {
            border-color: rgba(255, 70, 120, 0.3);
            box-shadow: 0 0 0 5px rgba(255, 70, 120, 0.06), inset 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .input-group input {
            flex: 1;
            padding: 14px 0;
            background: transparent;
            border: none;
            outline: none;
            color: #f0edff;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            min-width: 0;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.2);
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        .input-group button {
            padding: 14px 34px;
            background: linear-gradient(135deg, #f9416b, #d61a4e);
            border: none;
            border-radius: 60px;
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.3s ease, background 0.3s ease;
            box-shadow: 0 8px 28px rgba(249, 65, 107, 0.35);
            white-space: nowrap;
        }

        .input-group button i {
            font-size: 1rem;
        }

        .input-group button:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 14px 40px rgba(249, 65, 107, 0.50);
            background: linear-gradient(135deg, #ff4f78, #e01e54);
        }

        .input-group button:active {
            transform: scale(0.96);
            box-shadow: 0 4px 16px rgba(249, 65, 107, 0.25);
        }

        /* ---------- LOADING ---------- */
        .loading {
            display: none;
            text-align: center;
            padding: 24px 0 16px;
        }

        .spinner {
            width: 44px;
            height: 44px;
            margin: 0 auto;
            border: 3px solid rgba(249, 65, 107, 0.12);
            border-top: 3px solid #f9416b;
            border-radius: 50%;
            animation: spin 0.8s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading p {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.85rem;
            margin-top: 14px;
            font-weight: 400;
        }

        /* ---------- ERROR ---------- */
        .error-msg {
            color: #f87171;
            background: rgba(248, 113, 113, 0.07);
            border: 1px solid rgba(248, 113, 113, 0.10);
            padding: 14px 20px;
            border-radius: 16px;
            font-weight: 500;
            font-size: 0.9rem;
            display: none;
            margin: 8px 0 4px;
            text-align: center;
        }

        /* ---------- RESULT ---------- */
        .result-box {
            display: none;
            margin-top: 28px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 24px;
            padding: 24px 24px 18px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            animation: fadeUp 0.5s ease;
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(16px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-box h3 {
            color: rgba(255, 255, 255, 0.65);
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.3px;
        }

        .result-box h3 i {
            color: #34d399;
            font-size: 1.2rem;
        }

        .quality-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .download-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px 14px 24px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #e8e4ff;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: background 0.25s ease, transform 0.2s ease, border-color 0.25s ease;
            cursor: pointer;
        }

        .download-btn:hover {
            background: rgba(249, 65, 107, 0.06);
            border-color: rgba(249, 65, 107, 0.15);
            transform: translateX(5px);
        }

        .download-btn span:first-child {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .download-btn span:first-child i {
            color: #f9416b;
            font-size: 1rem;
            width: 20px;
            text-align: center;
        }

        .download-btn span:last-child {
            background: rgba(249, 65, 107, 0.10);
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #ff8aa8;
            letter-spacing: 0.3px;
            transition: background 0.25s ease, color 0.25s ease;
        }

        .download-btn:hover span:last-child {
            background: rgba(249, 65, 107, 0.20);
            color: #ffb3c8;
        }

        /* ---------- FOOTER ---------- */
        footer {
            margin-top: 32px;
            text-align: center;
            color: rgba(255, 255, 255, 0.10);
            font-size: 0.7rem;
            font-weight: 400;
            letter-spacing: 0.6px;
            padding: 8px 0;
        }

        footer p {
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            padding-top: 18px;
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 576px) {
            .container {
                padding: 26px 18px 24px;
                border-radius: 32px;
            }

            .top-bar {
                flex-wrap: wrap;
                gap: 12px;
                justify-content: center;
                margin-bottom: 20px;
            }

            .brand-icon {
                font-size: 0.85rem;
            }

            .logo h1 {
                font-size: 1.8rem;
            }
            .logo h1 i {
                font-size: 1.5rem;
            }

            .input-group {
                flex-direction: column;
                background: transparent;
                padding: 0;
                border: none;
                box-shadow: none;
                gap: 12px;
                border-radius: 0;
            }

            .input-group input {
                background: rgba(255, 255, 255, 0.04);
                padding: 16px 20px;
                border-radius: 60px;
                border: 1px solid rgba(255, 255, 255, 0.06);
                font-size: 0.95rem;
            }

            .input-group input:focus {
                border-color: rgba(249, 65, 107, 0.25);
                box-shadow: 0 0 0 4px rgba(249, 65, 107, 0.05);
            }

            .input-group button {
                justify-content: center;
                padding: 16px 20px;
                font-size: 0.95rem;
                border-radius: 60px;
                width: 100%;
            }

            .result-box {
                padding: 18px 16px 14px;
            }

            .download-btn {
                padding: 12px 16px 12px 18px;
                font-size: 0.85rem;
                flex-wrap: wrap;
                gap: 8px;
            }

            .download-btn span:last-child {
                padding: 4px 14px;
                font-size: 0.7rem;
            }
        }

        @media (max-width: 400px) {
            .container {
                padding: 20px 12px 18px;
            }
            .logo h1 {
                font-size: 1.4rem;
            }
            .logo p {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- TOP BAR: Pinterest Logo + Tip Button -->
        <div class="top-bar">
            <div class="brand-icon">
                <i class="fab fa-pinterest"></i>
                <span>Pinterest</span>
            </div>
            <a href="#" class="tip-btn" onclick="alert('💖 Thanks for supporting! Tip feature coming soon.')">
                <i class="fas fa-mug-hot"></i> Tip us
            </a>
        </div>

        <!-- HEADER -->
        <div class="logo">
            <h1>
                <i class="fab fa-pinterest"></i> DG Downloader
            </h1>
            <p><i class="fas fa-play-circle"></i> Paste your Pinterest video link &amp; download in high quality</p>
        </div>

        <!-- INPUT -->
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="Paste Pinterest video URL here..." />
            <button onclick="downloadVideo()">
                <i class="fas fa-download"></i> Download
            </button>
        </div>

        <!-- LOADING -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Fetching video qualities…</p>
        </div>

        <!-- ERROR -->
        <div class="error-msg" id="errorMsg"></div>

        <!-- RESULT -->
        <div class="result-box" id="resultBox">
            <h3><i class="fas fa-circle-check"></i> Choose quality to download</h3>
            <div class="quality-options" id="qualityOptions"></div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 DG Downloader — All rights reserved.</p>
    </footer>

    <script>
        // ─── 100% ORIGINAL API LOGIC (unchanged) ──────────────────────
        async function downloadVideo() {
            const urlInput = document.getElementById('urlInput').value.trim();
            const loading = document.getElementById('loading');
            const resultBox = document.getElementById('resultBox');
            const errorMsg = document.getElementById('errorMsg');
            const qualityOptions = document.getElementById('qualityOptions');

            resultBox.style.display = "none";
            errorMsg.style.display = "none";
            qualityOptions.innerHTML = "";

            if (!urlInput) {
                errorMsg.innerText = "Please enter a valid Pinterest URL!";
                errorMsg.style.display = "block";
                return;
            }

            loading.style.display = "block";

            try {
                const apiURL =
                    `https://dg-pinterest-api.onrender.com/api/pinterest?url=${encodeURIComponent(urlInput)}`;
                const response = await fetch(apiURL);
                const data = await response.json();

                loading.style.display = "none";

                if (data.status && data.qualities) {
                    let htmlContent = '';
                    for (const [quality, videoUrl] of Object.entries(data.qualities)) {
                        const proxyUrl =
                            `https://dg-pinterest-api.onrender.com/api/download-proxy?url=${encodeURIComponent(videoUrl)}`;
                        htmlContent += `
                                <a href="${proxyUrl}" class="download-btn" download="DG-Pinterest.mp4">
                                    <span><i class="fas fa-video"></i> ${quality}</span>
                                    <span><i class="fas fa-download"></i> Download</span>
                                </a>
                            `;
                    }
                    qualityOptions.innerHTML = htmlContent;
                    resultBox.style.display = "block";
                } else {
                    errorMsg.innerText = data.message || "Could not fetch video. Check your link.";
                    errorMsg.style.display = "block";
                }
            } catch (error) {
                loading.style.display = "none";
                errorMsg.innerText = "Connection error. Please try again!";
                errorMsg.style.display = "block";
            }
        }
    </script>

</body>
</html>
