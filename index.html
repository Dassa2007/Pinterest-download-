<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DG DOWNLOADER - Pinterest Video Downloader</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            text-align: center;
            width: 90%;
        }

        .logo h1 {
            font-size: 2.5rem;
            color: #e60023;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .logo h1 span {
            color: #fff;
        }

        .logo p {
            color: #ddd;
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .input-group input {
            flex: 1;
            padding: 15px 20px;
            border: none;
            outline: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 1rem;
        }

        .input-group button {
            padding: 0 25px;
            border: none;
            outline: none;
            background: #e60023;
            color: #fff;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1rem;
        }

        .input-group button:hover {
            background: #ad081b;
            transform: translateY(-2px);
        }

        .loading {
            display: none;
            margin: 20px 0;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #e60023;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-box {
            display: none;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            text-align: left;
        }

        .download-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            margin-top: 10px;
            transition: 0.3s;
        }

        .download-btn:hover {
            background: #218838;
        }

        .error-msg {
            color: #ff6b6b;
            margin-top: 15px;
            font-weight: 500;
            display: none;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #aaa;
            font-size: 0.85rem;
            background: rgba(0, 0, 0, 0.2);
        }

        @media (max-width: 576px) {
            .input-group {
                flex-direction: column;
            }
            .input-group button {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">
            <h1>DG <span>DOWNLOADER</span></h1>
            <p>Paste your Pinterest video link below and download instantly!</p>
        </div>

        <div class="input-group">
            <input type="text" id="urlInput" placeholder="Paste Pinterest link here...">
            <button onclick="downloadVideo()">
                <i class="fa-solid fa-download"></i> Download
            </button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 10px; font-size: 0.9rem;">Fetching video...</p>
        </div>

        <div class="error-msg" id="errorMsg"></div>

        <div class="result-box" id="resultBox">
            <h3><i class="fa-solid fa-circle-check" style="color: #28a745;"></i> Video Found Successfully!</h3>
            <div id="downloadLinks"></div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 DG DOWNLOADER. All Rights Reserved.</p>
    </footer>

    <script>
        const API_KEY = "zanta_JatdaWBTIbi4uSdilQ1q6gE3";

        async function downloadVideo() {
            const urlInput = document.getElementById('urlInput').value.trim();
            const loading = document.getElementById('loading');
            const resultBox = document.getElementById('resultBox');
            const errorMsg = document.getElementById('errorMsg');
            const downloadLinks = document.getElementById('downloadLinks');

            resultBox.style.display = "none";
            errorMsg.style.display = "none";
            downloadLinks.innerHTML = "";

            if (!urlInput) {
                errorMsg.innerText = "Please enter a valid Pinterest URL!";
                errorMsg.style.display = "block";
                return;
            }

            loading.style.display = "block";

            try {
                const targetAPI = `https://api.zanta-mini.store/api/pinterest?apiKey=${API_KEY}&url=${encodeURIComponent(urlInput)}`;
                // Using allorigins cors proxy to bypass browser restrictions
                const proxyURL = `https://api.allorigins.win/get?url=${encodeURIComponent(targetAPI)}`;
                
                const response = await fetch(proxyURL);
                const proxyData = await response.json();
                
                if (!proxyData.contents) {
                    throw new Error("Failed to connect to API");
                }

                const data = JSON.parse(proxyData.contents);

                loading.style.display = "none";

                // Check possible JSON keys returned by the API
                const videoUrl = data.url || data.video || data.download || data.result || (data.data && data.data.url);

                if (videoUrl) {
                    downloadLinks.innerHTML = `
                        <a href="${videoUrl}" class="download-btn" target="_blank" download>
                            <i class="fa-solid fa-download"></i> Download Video (HD)
                        </a>
                    `;
                    resultBox.style.display = "block";
                } else {
                    errorMsg.innerText = data.message || "Could not fetch video. Please check the link.";
                    errorMsg.style.display = "block";
                }
            } catch (error) {
                loading.style.display = "none";
                errorMsg.innerText = "An error occurred while connecting to the server. Try again!";
                errorMsg.style.display = "block";
            }
        }
    </script>
</body>
</html>
